#extent.properties
extent.reporter.html.start=true
extent.reporter.spark.start=true
extent.reporter.logger.start=true
#theme title encoding
extent.reporter.html.config=src/test/resources/extent-config.xml
extent.reporter.spark.config=src/test/resources/extent-config.xml
extent.reporter.logger.config=src/test/resources/extent-config.xml
extent.reporter.html.out=test-output/ExtendReportHTML.html
extent.reporter.spark.out=test-output/ExtendReportSPARK.html
extent.reporter.logger.out=test-output/logger
#Screenshot
screenshot.dir=test-output/screenshots/
screenshot.rel.path=../test-output/screenshots/
extent.reporter.spark.vieworder=dashboard,test,exception,author,device,log
systeminfo.user=TestUser
systeminfo.build=1
systeminfo.AppName=OrangeHRMS
#Adding folder name and non repeating pattern
#basefolder.name=test-output/ExtendReport
#basefolder.datetimepattern=dd-MMM-YYYY_hh-mm-ss-a